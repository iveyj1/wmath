[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "wmath"
version = "0.1.0"
description = "Python/PySide6 working prototype of a free-form computational sheet"
readme = "docs/user.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
wmath = "wmath.app.main:main"

[tool.setuptools.packages.find]
include = ["wmath*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
